name = "casamento-thalia-gian"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Serve o frontend buildado (SPA) pelo mesmo Worker — sem CORS, uma única URL.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
# Garante que requests /api/* executem o Worker antes de tentar servir um asset.
binding = "ASSETS"
# Sem isto o index.html é entregue direto pelo servidor de assets e o Worker
# nem roda — ou seja, não há como injetar as configurações do site no HTML.
# Com `true`, todo request passa pelo Worker; os que não são /api/* e não são
# HTML voltam intactos de `ASSETS.fetch` (custo desprezível, e os arquivos com
# hash no nome continuam com cache imutável no navegador).
run_worker_first = true

# Banco de dados D1 (SQLite). Crie com:
#   wrangler d1 create casamento-db
# e cole o database_id retornado abaixo.
[[d1_databases]]
binding = "DB"
database_name = "casamento-db"
database_id = "419da4dd-e9f5-4b58-81d5-059405a3ed1b"
migrations_dir = "migrations"

# Segredos (defina com `wrangler secret put NOME`):
#   JWT_SECRET             → chave para assinar tokens de sessão do admin
#   CLOUDINARY_API_SECRET  → segredo do Cloudinary (não versionar!)
[vars]
APP_ENV = "production"
# Cloudinary (armazenamento de fotos, grátis, sem cartão).
# Reaproveitando a mesma conta Cloudinary do site-capela (as fotos deste site
# ficam em pastas separadas: casamento/*). cloud_name e api_key não são sensíveis.
CLOUDINARY_CLOUD_NAME = "ohqk1n9a"
CLOUDINARY_API_KEY = "745375866891331"
